search_now:
refresh:
skip_pick:
  fields:
    item_id:
      required: true
      example: "278435397313"
      selector:
        text:
pick_feedback:
  fields:
    item_id:
      required: true
      example: "278435397313"
      selector:
        text:
    reason:
      required: true
      selector:
        select:
          translation_key: feedback_reason
          options:
            - overvalued
            - wrong_card
            - bad_seller
            - dont_want_this_type
            - already_have
            - other
            - good_pick
    note:
      required: false
      example: "Signed base card, worth about $25"
      selector:
        text:
restore_skipped:
mark_filed:
  fields:
    ids:
      required: true
      example: ["412", "413"]
      selector:
        object:
gixen_refresh:
  fields:
    login:
      default: false
      selector:
        boolean:
send_test_alert:
